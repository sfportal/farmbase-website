<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bài kiểm tra · BVI</title>
<style>body{margin:0;font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f6f1;color:#17251c}@media (prefers-color-scheme:dark){body{background:#0f1712;color:#e4ede6}}p{padding:40px 16px;text-align:center}</style></head>
<body><p id="m">Đang tải bài kiểm tra…</p>
<script>
// Trang khởi động cố định: tải bản mới nhất của ứng dụng rồi hiển thị
(async () => {
  const src = ["https://raw.githubusercontent.com/uyducminh/farmbase-website/kiem-tra-public/app.html", "https://cdn.jsdelivr.net/gh/uyducminh/farmbase-website@kiem-tra-public/app.html"];
  for (const u of src) {
    try { const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) continue; const h = await r.text(); if (!h.includes("bai-kiem-tra")) continue; document.open(); document.write(h); document.close(); return } catch (_) {}
  }
  document.getElementById("m").textContent = "Chưa tải được trang. Kiểm tra mạng rồi tải lại.";
})();
</script></body></html>
