<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Màn hình khách đăng ký – Hội thảo AI 10/11</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--forest:#0E3B2C;--deep:#06201A;--green:#1F7A4D;--gold:#E0A526;--mint:#EAF4EE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:radial-gradient(circle at 85% 0%,#1C5A3A,var(--deep) 60%);color:#fff;min-height:100vh;padding:3vw;overflow:hidden}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:3vw;height:calc(100vh - 6vw)}
h1{font-size:2.6vw;font-weight:800;line-height:1.15}
h1 span{color:var(--gold)}
.qr{background:#fff;border-radius:2vw;padding:1.4vw;width:19vw;margin:2vw 0 1vw}
.qr img{width:100%;display:block}
.hint{color:#CFE6D6;font-size:1.25vw}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1vw;margin-top:2vw}
.stats div{background:rgba(255,255,255,.07);border-radius:1.2vw;padding:1.2vw}
.stats strong{display:block;font-size:3.6vw;color:var(--gold);font-weight:800;line-height:1}
.stats span{font-size:1.05vw;color:#CFE6D6}
.feed{display:flex;flex-direction:column;gap:1vw;overflow:hidden}
.feed h2{font-size:1.4vw;letter-spacing:.14em;text-transform:uppercase;color:#9FD3AE;display:flex;align-items:center;gap:.8vw}
.dot{width:.9vw;height:.9vw;border-radius:50%;background:#ff5a4f;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.it{background:#fff;color:#14261D;border-radius:1.4vw;padding:1.3vw 1.6vw;display:flex;gap:1.4vw;align-items:center;animation:in .7s cubic-bezier(.2,.8,.2,1)}
.it.new{box-shadow:0 0 0 .3vw var(--gold)}
@keyframes in{from{opacity:0;transform:translateY(-2vw) scale(.97)}}
.av{flex:0 0 4.2vw;height:4.2vw;border-radius:50%;background:var(--forest);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:1.8vw}
.it b{font-size:1.5vw;color:var(--forest)}
.it p{font-size:1.1vw;color:#55675d}
.tag{margin-left:auto;text-align:right;white-space:nowrap}
.tag em{display:block;font-style:normal;background:var(--gold);color:var(--forest);font-weight:800;border-radius:99px;padding:.3vw 1vw;font-size:1.05vw}
.tag small{font-size:1vw;color:var(--green);font-weight:700}
.empty{color:#9FD3AE;font-size:1.4vw;padding:2vw 0}
.lock{max-width:420px;margin:20vh auto;text-align:center}
.lock input{font:inherit;font-size:18px;padding:12px;border-radius:12px;border:0;width:100%;margin:14px 0}
.lock button{font:inherit;font-weight:700;padding:12px 24px;border-radius:99px;border:0;background:var(--gold);color:var(--forest)}
</style>
</head>
<body>
<div class="lock" id="lock"><h1>Màn hình trình chiếu</h1><input id="k" placeholder="Nhập mã xem" type="password"><button id="go">Mở</button></div>
<div class="grid" id="main" style="display:none">
  <div>
    <h1>Quét mã, <span>AI viết đề xuất</span><br>cho doanh nghiệp của anh/chị trong 30 giây</h1>
    <div class="qr"><img src="qr-form.png" alt="Mã QR form đăng ký"></div>
    <p class="hint">Mở camera điện thoại, quét mã, điền 1 phút</p>
    <div class="stats">
      <div><strong id="n">0</strong><span>khách đã nhận đề xuất</span></div>
      <div><strong id="h">0</strong><span>giờ/tháng AI có thể tiết kiệm cho khán phòng</span></div>
    </div>
  </div>
  <div class="feed"><h2><span class="dot"></span>Vừa nhận đề xuất AI</h2><div id="list"><p class="empty">Đang chờ khách đầu tiên…</p></div></div>
</div>
<script>
const API = "/api/hoi-thao";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let key = new URLSearchParams(location.search).get("k") || sessionStorage.getItem("hk") || "";
const seen = new Set(); let first = true;
async function tick() {
  try {
    const r = await fetch(API + "?k=" + encodeURIComponent(key));
    if (r.status === 403) { document.getElementById("lock").style.display = ""; document.getElementById("main").style.display = "none"; return; }
    const d = await r.json(); if (!d.feed) return;
    document.getElementById("lock").style.display = "none"; document.getElementById("main").style.display = "";
    sessionStorage.setItem("hk", key);
    document.getElementById("n").textContent = d.feed.length;
    document.getElementById("h").textContent = d.feed.reduce((s, x) => s + (x.gio || 0), 0).toLocaleString("vi-VN");
    if (!d.feed.length) return;
    document.getElementById("list").innerHTML = d.feed.slice(0, 6).map(x => {
      const isNew = !first && !seen.has(x.id);
      const ago = Math.max(0, Math.round((Date.now() - new Date(x.t)) / 60000));
      return `<div class="it ${isNew ? "new" : ""}"><div class="av">${esc((x.ten || "?")[0])}</div><div><b>${esc(x.ten)}${x.cong_ty ? " · " + esc(x.cong_ty) : ""}</b><p>${esc(x.linh_vuc || "")}${x.quy_mo ? " · " + esc(x.quy_mo) + " người" : ""} · ${ago ? ago + " phút trước" : "vừa xong"}</p></div><div class="tag"><em>${esc(x.goi)}</em><small>−${x.gio || 0} giờ/tháng</small></div></div>`;
    }).join("");
    d.feed.forEach(x => seen.add(x.id)); first = false;
  } catch (e) {}
}
document.getElementById("go").onclick = () => { key = document.getElementById("k").value.trim(); tick(); };
if (key) tick(); setInterval(() => key && tick(), 5000);
</script>
</body>
</html>
